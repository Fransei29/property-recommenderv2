version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: property_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: inmobiliaria_db
      MYSQL_USER: usuario
      MYSQL_PASSWORD: contraseña
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./backend/migrate_add_reviews.sql:/docker-entrypoint-initdb.d/02-reviews.sql
    networks:
      - property_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: property_backend
    restart: unless-stopped
    environment:
      - PORT=8000
      - DB_HOST=mysql
      - DB_USER=usuario
      - DB_PASSWORD=contraseña
      - DB_NAME=inmobiliaria_db
      - SECRET_KEY=esta_es_una_clave_muy_secreta_y_larga_para_produccion
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads
    networks:
      - property_network
    command: ["npm", "start"]

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: property_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - API_INTERNAL_URL=http://backend:8000
      - NEXTAUTH_URL=http://localhost:3001
      - NEXTAUTH_SECRET=tu_nextauth_secret_aqui
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - property_network

volumes:
  mysql_data:

networks:
  property_network:
    driver: bridge 